    <script>
      // Runs before first paint.
      // 1. Marks the page as "JavaScript is on", which lets the stylesheet hide the things that
      //    animate in on scroll. Without that mark (no JS at all) everything is simply visible.
      // 2. Picks the theme: the visitor's saved choice, otherwise their system setting.
      // 3. Safety net: if the app has not started after five seconds (a blocked or failed
      //    script), drop the mark so nothing stays hidden.
      ;(function () {
        var d = document.documentElement
        d.classList.add('js')
        try {
          var t = localStorage.getItem('theme')
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          d.dataset.theme = t
          if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#efede6'
        } catch (e) {}
        setTimeout(function () {
          if (!window.__app) d.classList.remove('js')
        }, 5000)
      })()
    </script>
